name: tests

# P7.2. The full suite on every pull request, from a clean checkout.
#
# One job per service, and that is not an arrangement of convenience. The five
# services use flat module names that match their container layout - each has its
# own `app.py`, and `services/gateway` and `services/response` both have a
# `main.py` - so a single pytest process over `services/` imports whichever
# `app` reached `sys.path` first and every later service tests the wrong module.
# Measured: 19 failed and 113 collection errors in one pass, against 632 passed
# across five per-service runs. Restructuring the imports so one process works
# would mean changing how the containers themselves load, for no gain a matrix
# does not already give.
#
# Each job installs from the service's own requirements.txt, so a dependency a
# service forgot to declare fails here rather than on a machine where it happens
# to be installed for some other reason. `psutil` in the Monitor is exactly that
# case: its benchmarks import it and its requirements.txt does not list it,
# because it is a test-only dependency of a service that does not use it at
# runtime. It is installed below as one, and named as one.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reports are gated on this. CI measures nothing and must write nothing into
  # reports/: a green run that regenerated an artefact would silently replace
  # something a frozen tag is supposed to pin.
  URDS_WRITE_REPORTS: ""

jobs:
  suite:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            extras: ""
          - service: ledger
            extras: ""
          - service: monitor
            # Test-only. `test_benchmarks.py` measures CPU and RSS against
            # Table 5.9's targets; nothing the container runs imports psutil.
            extras: "psutil"
          - service: ml-engine
            # 18 of this service's tests are `skipif`-gated on
            # models/behavioral_model.pkl, and `models/` is gitignored - a
            # pickle is not a source artefact and does not belong in the tree.
            # They skip in CI and say why, which is the honest outcome: the
            # alternative is training a model in the job and then testing a
            # different model from the one that ships. **TC-20 and TC-21 do not
            # skip** - TC-20 rebuilds the training corpus from its seed and
            # TC-21 reads reports/behavioral_model_metrics.json, which is
            # tracked - so Table 9.7's rows are covered either way.
            extras: ""
          - service: response
            # Test-only, and the same case as `psutil` above. TC-04's
            # `test_tc04_a_real_detect_encrypt_recover_cycle_verifies` loads
            # `services/monitor/app.py` by file location, because a real
            # detect-encrypt-recover cycle needs the real detector rather than a
            # stand-in for it - and the Monitor imports `watchdog` at module
            # scope. Nothing the Response container runs imports it, so it does
            # not belong in `services/response/requirements.txt`; it belongs
            # here, named as what it is.
            #
            # This is the first thing the first CI run ever found. It passed on
            # every developer machine because those have all five services'
            # requirements installed in one environment, which is exactly the
            # condition the per-service matrix exists to stop hiding.
            extras: "watchdog==6.0.0"
    steps:
      # Full history, not the default depth-1. The Monitor's
      # `test_claim_matrix.py` asks whether each evidence artefact's recorded
      # commit is an ancestor of HEAD, and in a shallow clone those older
      # commits are simply absent - the test would skip, and a skipped
      # provenance check is the condition it exists to end.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx ${{ matrix.extras }}

      - name: Run
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q --durations=10

  # Table 9.7's acceptance rows, named on their own so a pull request shows at a
  # glance whether they still hold. These same tests run inside the matrix above;
  # this job exists so the answer is a line in the checks list rather than
  # something a reviewer has to go and find in a log.
  #
  # It installs every service's requirements because the rows cross services:
  # TC-25 drives the Monitor's pipeline and the Response service's
  # RecoveryManager in one test, and TC-20 rebuilds the training corpus from
  # `src/train_behavioral_model.py`, which imports both the Monitor's detection
  # module and the scientific stack the ml-engine ships.
  acceptance-rows:
    name: TC-14 … TC-25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install every service
        run: |
          python -m pip install --upgrade pip
          for service in gateway ledger monitor ml-engine response; do
            python -m pip install -r "services/$service/requirements.txt"
          done
          python -m pip install pytest pytest-asyncio httpx psutil

      - name: AS rows - TC-14 … TC-19
        working-directory: services/monitor
        run: python -m pytest -q tests/test_tc1[4-9]*.py

      - name: NI row - TC-22
        working-directory: services/monitor
        run: python -m pytest -q tests/test_tc22*.py

      - name: SI row - TC-23
        working-directory: services/monitor
        run: python -m pytest -q tests/test_tc23*.py

      - name: NI rows - TC-20, TC-21
        working-directory: services/ml-engine
        run: python -m pytest -q tests/test_tc2[01]*.py

      - name: SI row - TC-24
        working-directory: services/response
        run: python -m pytest -q tests/test_tc24*.py

      # TC-26 spans two services: the Monitor decides whether the evidence
      # authorises a kill, and the Response service guards what it will accept.
      # Both halves run here because testing only the first would leave the
      # gate provable at the point it is defined and unprovable at the point it
      # is enforced.
      #
      # The real attribution source is a Windows Security-channel subscription
      # needing Administrator, which this runner is not and does not have. It
      # is covered by one `skipif` test; everything else - the confidence
      # ladder, the 4663 parser, the pipeline gate and the kill guard - is
      # platform-independent by construction and runs here in full.
      - name: AS row - TC-26 attribution
        working-directory: services/monitor
        run: python -m pytest -q tests/test_tc26*.py

      - name: AS row - TC-26 kill guard
        working-directory: services/response
        run: python -m pytest -q tests/test_tc26*.py

      - name: SH row - TC-25
        working-directory: services/gateway
        run: python -m pytest -q tests/test_tc25*.py

      # The claim matrix itself, as a job step rather than only as a test.
      # `--tests` is deliberately not passed: the regressions it would run are
      # the same ones the matrix above already runs per service, and running
      # them twice buys nothing. What this adds is the provenance pass, which
      # is not a pytest assertion - it reads every evidence artefact's stamp
      # and refuses a figure measured on a commit that is not in this history.
      #
      # URDS_WRITE_REPORTS stays empty (set at workflow scope): this step
      # checks the artefacts, and must not regenerate them.
      - name: Claim matrix and artefact provenance
        run: python scripts/claim_matrix.py
