openapi: 3.0.3
info:
  title: URDS API Gateway
  version: 1.0.0
  description: Unified Ransomware Detection and Recovery System gateway contract for SH integration scope.
servers:
  - url: http://localhost:8000
security:
  - BearerAuth: []
paths:
  /health:
    get:
      summary: Gateway and downstream service health
      security: []
      responses:
        "200":
          description: Health state for the gateway and downstream services.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/token:
    post:
      summary: Development-only JWT token generator
      description: >-
        Phase 4 placeholder; verifies no identity and must be replaced with real
        identity management. An empty body yields a `free` token, which can read
        but cannot act. Any role or tier above `free` requires the shared secret
        in the `X-Bootstrap-Secret` header. The whole endpoint returns 403
        `DEV_TOKENS_DISABLED` when `ALLOW_DEV_TOKENS` is false.
      security: []
      parameters:
        - in: header
          name: X-Bootstrap-Secret
          required: false
          schema:
            type: string
          description: Shared bootstrap secret. Required only for a role or tier above `free`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: JWT access token for local development.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /monitor/start:
    post:
      summary: Start file monitoring
      description: "Requires role: admin or enterprise."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorStartRequest"
      responses:
        "200":
          description: Monitor started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /monitor/stop:
    post:
      summary: Stop file monitoring
      description: "Requires role: admin. Stopping the monitor blinds detection for the whole host."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorStopRequest"
      responses:
        "200":
          description: Monitor stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStopResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The supplied monitor_id is not the monitor that is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /monitor/status:
    get:
      summary: Current monitor status
      responses:
        "200":
          description: Monitor status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /monitor/events:
    get:
      summary: Recent file events for Dashboard v1
      responses:
        "200":
          description: Recent monitor events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorEventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /predict:
    post:
      summary: Predict ransomware risk from file features
      description: "Requires role: admin or enterprise."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictRequest"
      responses:
        "200":
          description: Prediction result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /model/metrics:
    get:
      summary: Current ML model metrics
      responses:
        "200":
          description: Model quality metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelMetricsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /ledger/log:
    post:
      summary: Log an event to the ledger
      description: "Requires role: admin or enterprise. The chain is append-only, so a write is permanent."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerLogRequest"
      responses:
        "200":
          description: Ledger block response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerLogResponse"
        "201":
          description: Ledger block created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerLogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /ledger/entries:
    get:
      summary: Recent ledger entries for Dashboard v1
      responses:
        "200":
          description: Recent ledger entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntriesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /ledger/verify:
    get:
      summary: Verify the hash chain and report the first broken block
      responses:
        "200":
          description: Chain verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerVerifyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /ledger/blocks:
    get:
      summary: Paginated read of the audit trail
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - in: query
          name: event_type
          schema:
            type: string
          description: Filter by event type.
        - in: query
          name: file_path
          schema:
            type: string
          description: Filter to events about one file.
        - in: query
          name: newest_first
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of ledger blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerBlocksResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /response/terminate:
    post:
      summary: Terminate a suspicious process
      description: "Requires role: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminateRequest"
      responses:
        "200":
          description: Process termination result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            The termination guard refused. Raised when the PID does not exist,
            is reserved (0 or 1), belongs to the response service or one of its
            ancestors, is a protected system process, or is not inspectable by
            this user. The request was well-formed and authorised, so this is
            neither 400 nor 403; the process is simply not one this service will
            kill. Note that 409 is outside Table 3.2's enumeration - see
            APPROACH.md section 8.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /response/suspend:
    post:
      summary: Suspend a process under a lease
      description: >-
        Requires role: admin. Suspend-first response (defect 26, F2b): the
        process is frozen, not killed, and held under a lease that ends on
        its own. A lease ends by `/response/resume`, by expiring (the Response
        service resumes the process itself), by `/response/terminate` with its
        `lease_id`, or when the Response service stops; an out-of-process
        watchdog resumes it if the service dies outright. One lease per PID:
        a second suspend of a held PID suspends nothing and returns the
        existing lease with `already_held: true`, because suspension nests on
        Windows and a second suspend would need a second resume. Every
        outcome, refusals included, is recorded as a `process_suspended`
        ledger block carrying the PID together with what the caller claimed
        allowed it, recorded as the caller's (`attribution_confidence`,
        `attribution_source`, `attribution_reason`,
        `attribution_supplied_by: caller`, `gate` verbatim or null,
        `gate_verified: false`, `gate_reason`). The Response service
        evaluates no gate and never writes one of its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendRequest"
      responses:
        "200":
          description: The process is suspended under the lease returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuspendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            The suspend was refused, and the refusal recorded. `code` is one
            of RESERVED_PID, RESPONSE_OR_ANCESTOR, SYSTEM_PROCESS (a protected
            name or an image under a system directory), PID_GONE,
            NOT_INSPECTABLE, MONITOR_OR_ANCESTOR (`URDS_MONITOR_PID`),
            LEASE_WATCHDOG, PID_REUSED (the live process was created after
            `started_at`, or runs another image), IDENTITY_UNPROVEN (neither
            `image` nor `started_at` could be checked), NOT_ATTRIBUTED
            (`attribution_confidence` is unknown), PID_NAMESPACE_ISOLATED (the
            Response service runs in a container's PID namespace, as in
            Compose, and cannot act on a host PID), WATCHDOG_UNAVAILABLE,
            NOT_PERMITTED, MONITOR_PID_INVALID (`URDS_MONITOR_PID` is set but
            does not parse), SHUTTING_DOWN, LEASE_STATE_UNCERTAIN. The
            Response service returns the standard error
            envelope with `code` and `message` also at the top level; through
            the gateway it arrives wrapped as DOWNSTREAM_ERROR with that body
            in `details`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /response/resume:
    post:
      summary: End a lease and resume the process
      description: >-
        Requires role: admin. Idempotent: resuming a lease that has already
        ended, or a PID with no lease, returns 200 with `resumed: false` and
        touches nothing. It never resumes a process the Response service did
        not suspend. A resume that happens is recorded as a `process_resumed`
        ledger block with the reason, joined to the suspend by `lease_id` and
        `incident_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "200":
          description: Whether the process was resumed by this call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /response/leases:
    get:
      summary: Leases held, then recently ended
      description: "Requires role: admin."
      responses:
        "200":
          description: Held leases first, then up to 1,024 recently ended ones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lease"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /response/isolate:
    post:
      summary: Isolate host/network
      description: "Requires role: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IsolateRequest"
      responses:
        "200":
          description: Isolation action result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsolateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /response/recover:
    post:
      summary: Recover files from a snapshot
      description: "Requires role: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverRequest"
      responses:
        "200":
          description: Recovery result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /response/trigger:
    post:
      summary: Trigger automated incident response
      description: "Requires role: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRequest"
      responses:
        "200":
          description: Response trigger result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /analyze:
    post:
      summary: Analyze a file through Monitor, ML Engine, and Ledger
      description: "Requires role: admin or enterprise."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Prediction returned after ledger logging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        Authenticated, but the token's role may not perform this action.
        `details.role` carries the role presented and `details.required_roles`
        the roles that would have been accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Downstream service unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, timestamp, request_id]
      properties:
        code:
          type: string
          example: PREDICTION_FAILED
        message:
          type: string
          example: Unable to classify file due to missing features
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
          example: req_abc123
    ErrorResponse:
      type: object
      required: [error, details]
      properties:
        error:
          $ref: "#/components/schemas/ErrorEnvelope"
        details:
          type: object
          additionalProperties: true
          example:
            missing_features: [pe_imports_count, api_calls]
    TokenRequest:
      type: object
      properties:
        sub:
          type: string
          default: user_id_123
        role:
          type: string
          default: free
          enum: [free, premium, enterprise, admin]
          description: Anything other than `free` requires the `X-Bootstrap-Secret` header.
        tier:
          type: string
          default: free
          enum: [free, premium, enterprise]
          description: Rate-limit tier. Anything other than `free` requires the `X-Bootstrap-Secret` header.
    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
    HealthResponse:
      type: object
      required: [status, services]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        services:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
    MonitorStartRequest:
      type: object
      required: [watch_path, recursive, file_patterns]
      properties:
        watch_path:
          type: string
          example: /path/to/monitor
        recursive:
          type: boolean
          example: true
        file_patterns:
          type: array
          items:
            type: string
          example: ["*.doc", "*.pdf", "*.jpg"]
    MonitorStartResponse:
      type: object
      required: [status, monitor_id, start_time]
      properties:
        status:
          type: string
          example: monitoring
        monitor_id:
          type: string
          example: mon_123abc
        start_time:
          type: string
          format: date-time
    MonitorStopRequest:
      type: object
      description: >-
        Optional. Only one monitor runs per Monitor process, so an omitted
        monitor_id means "stop whatever is running". When supplied it is checked
        against the running monitor, and a mismatch is refused with 404.
      properties:
        monitor_id:
          type: string
          example: mon_a1b2c3
    MonitorStopResponse:
      type: object
      required: [status, stop_time]
      properties:
        status:
          type: string
          example: stopped
        stop_time:
          type: string
          format: date-time
    MonitorStatusResponse:
      type: object
      required: [status, files_monitored, events_captured, uptime_seconds]
      properties:
        status:
          type: string
          example: active
        files_monitored:
          type: integer
          example: 1523
        events_captured:
          type: integer
          example: 45
        uptime_seconds:
          type: integer
          example: 3600
        file_patterns:
          type: array
          description: >-
            The glob filter actually in force. An empty list means every file on
            the watched path is processed.
          items:
            type: string
          example: ["*.doc", "*.pdf", "*.jpg"]
    FileEvent:
      type: object
      required: [event_id, file_path, event_type, entropy, timestamp]
      properties:
        event_id:
          type: string
        file_path:
          type: string
        event_type:
          type: string
        entropy:
          type: number
        timestamp:
          type: string
          format: date-time
    MonitorEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/FileEvent"
    FeatureSet:
      type: object
      required: [shannon_entropy, file_size, magic_bytes, modification_rate, pe_imports_count, api_calls]
      properties:
        shannon_entropy:
          type: number
          example: 7.89
        file_size:
          type: integer
          example: 1048576
          description: >-
            The size of the content the other fields were measured on: the
            hashed length where a hash is taken, otherwise the size after the
            sample was read.
        size_changed_during_read:
          type: boolean
          description: >-
            True when the file changed size while the Monitor was reading it,
            so file_size is from the end of the read. Returned by /features;
            not scored by the model.
        magic_bytes:
          type: string
          example: 4D5A
        modification_rate:
          type: number
          example: 0.85
        pe_imports_count:
          type: integer
          example: 45
        api_calls:
          type: array
          items:
            type: string
          example: [CreateFile, WriteFile, CryptEncrypt]
    PredictRequest:
      type: object
      required: [features]
      properties:
        features:
          $ref: "#/components/schemas/FeatureSet"
    PredictResponse:
      type: object
      required: [prediction, confidence, model_version, timestamp, threat_level, features_importance]
      properties:
        prediction:
          type: string
          example: ransomware
        confidence:
          type: number
          example: 0.94
        model_version:
          type: string
          example: 1.0.0
        timestamp:
          type: string
          format: date-time
        threat_level:
          type: string
          example: high
        features_importance:
          type: object
          additionalProperties:
            type: number
    ModelMetricsResponse:
      type: object
      required: [accuracy, precision, recall, f1_score, roc_auc, last_trained]
      properties:
        accuracy:
          type: number
          example: 0.92
        precision:
          type: number
          example: 0.91
        recall:
          type: number
          example: 0.93
        f1_score:
          type: number
          example: 0.92
        roc_auc:
          type: number
          example: 0.95
        last_trained:
          type: string
          format: date-time
    LedgerLogRequest:
      type: object
      required: [event_type, event_data]
      properties:
        event_type:
          type: string
          example: file_encrypted
        event_data:
          type: object
          additionalProperties: true
    LedgerLogResponse:
      type: object
      required: [block_id, current_hash, previous_hash, timestamp, tamper_proof]
      properties:
        block_id:
          type: integer
          example: 42
        current_hash:
          type: string
        previous_hash:
          type: string
        timestamp:
          type: string
          format: date-time
        tamper_proof:
          type: boolean
    LedgerEntriesResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LedgerLogResponse"
    LedgerBlock:
      type: object
      required: [block_id, timestamp, event_type, event_data, previous_hash, current_hash]
      properties:
        block_id:
          type: integer
          example: 42
        timestamp:
          type: string
          format: date-time
        event_type:
          type: string
          example: file_event
        event_data:
          type: object
          description: >-
            Event metadata only; raw file content never enters a block. Carries
            file_hash whenever the file's hash is known, which the recovery
            module reads back to verify a restore.
        previous_hash:
          type: string
          description: Full SHA-256, 64 hex characters.
          example: 3b1f0c5e9a7d4b28c6e1f0a9d8b7c6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d
        current_hash:
          type: string
          description: Full SHA-256, 64 hex characters.
        blockchain_anchor:
          type: string
          nullable: true
          description: Phase 5 (Polygon anchoring); null until then.
    LedgerBlocksResponse:
      type: object
      required: [blocks, total, offset, limit]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/LedgerBlock"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    LedgerVerifyResponse:
      type: object
      required: [valid, blocks_checked, verification_time_ms]
      properties:
        valid:
          type: boolean
        blocks_checked:
          type: integer
        invalid_block_id:
          type: integer
          nullable: true
          description: Block where the chain first breaks; null when valid.
        verification_time_ms:
          type: number
          description: Spec target is under 50ms.
    TerminateRequest:
      type: object
      required: [process_id, incident_id, reason, force]
      properties:
        process_id:
          type: integer
          example: 4512
        incident_id:
          type: string
          example: inc_998877
        reason:
          type: string
          example: ransomware_detected
        force:
          type: boolean
          example: true
        lease_id:
          type: string
          description: >-
            The lease the process is held under, if it was suspended first
            (defect 26). A successful kill closes that lease as terminated,
            without resuming. Optional; without it, any lease held for the
            PID is closed anyway.
    TerminateResponse:
      type: object
      required: [status, process_id, timestamp, exit_code]
      properties:
        status:
          type: string
          example: terminated
        process_id:
          type: integer
        timestamp:
          type: string
          format: date-time
        exit_code:
          type: integer
        lease_id:
          type: string
          nullable: true
          description: The lease the kill closed, or the one the request named.
        lease_released:
          type: boolean
          description: True when a held lease for this PID was closed by the kill.
    SuspendRequest:
      type: object
      required: [process_id, incident_id, lease_seconds, reason, attribution_confidence, attribution_source, attribution_reason]
      properties:
        process_id:
          type: integer
          example: 4512
        incident_id:
          type: string
          example: inc_998877
        lease_seconds:
          type: number
          description: >-
            How long to hold it: about the attribution horizon (1.5 s) plus a
            margin. A finite number above 0 (NaN or Infinity is a 400).
            Capped at RESPONSE_LEASE_MAX_SECONDS (default 10).
          example: 3.0
        reason:
          type: string
          example: sole writer of report.docx
        attribution_confidence:
          type: string
          description: >-
            The attribution the caller claims; recorded on every block naming
            the PID as the caller's (`attribution_supplied_by: caller`). The
            Response service cannot verify it.
          example: probable
        attribution_source:
          type: string
          example: windows-security-4663
        attribution_reason:
          type: string
          example: one writer so far (pending)
        image:
          type: string
          description: The image attribution named. Must match the live process if readable.
          example: C:\work\locker.exe
        started_at:
          description: >-
            The process's creation time, epoch seconds or ISO-8601. A live
            process created after it holds a reused PID. At least one of
            `image` and `started_at` must be checkable, or the suspend is
            refused.
          oneOf:
            - type: number
            - type: string
          example: 1790000000.25
        gate:
          type: string
          nullable: true
          description: >-
            The gate the caller says allowed the suspend (for example
            `suspend_authorised` from a Monitor that evaluates one). Optional.
            Recorded verbatim with `gate_verified: false`; without it the
            blocks record `gate: null` and `gate_reason: no gate supplied
            (operator request)`. The gateway forwards it only when given.
          example: suspend_authorised
    SuspendResponse:
      type: object
      required: [lease_id, process_id, suspended, expires_at, already_held]
      properties:
        lease_id:
          type: string
          example: lease_3f2a9c01d4e5b6a7
        process_id:
          type: integer
        suspended:
          type: boolean
          example: true
        expires_at:
          type: string
          format: date-time
        already_held:
          type: boolean
          description: True when the PID was already held; nothing was suspended again.
        incident_id:
          type: string
          description: The incident the lease was taken for (the first one, if already held).
        lease_seconds:
          type: number
          description: The lease granted, after the cap.
    ResumeRequest:
      type: object
      required: [incident_id, reason]
      description: One of `lease_id` or `process_id` is required.
      properties:
        lease_id:
          type: string
        process_id:
          type: integer
        incident_id:
          type: string
        reason:
          type: string
          example: a second writer appeared
    ResumeResponse:
      type: object
      required: [lease_id, resumed, reason]
      properties:
        lease_id:
          type: string
          nullable: true
        resumed:
          type: boolean
        reason:
          type: string
        process_id:
          type: integer
          nullable: true
        state:
          type: string
          enum: [held, resumed, terminated, gone, unknown]
        detail:
          type: string
          description: Why nothing was resumed, when `resumed` is false.
    Lease:
      type: object
      required: [lease_id, process_id, incident_id, expires_at, state]
      properties:
        lease_id:
          type: string
        process_id:
          type: integer
        incident_id:
          type: string
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [held, resumed, terminated, gone]
    IsolateRequest:
      type: object
      required: [isolation_level, duration_seconds, allow_localhost]
      properties:
        isolation_level:
          type: string
          example: full
        duration_seconds:
          type: integer
          example: 300
        allow_localhost:
          type: boolean
          example: true
    IsolateResponse:
      type: object
      required: [status, isolation_level, duration_seconds, timestamp]
      properties:
        status:
          type: string
          example: isolated
        isolation_level:
          type: string
        duration_seconds:
          type: integer
        timestamp:
          type: string
          format: date-time
    RecoverRequest:
      type: object
      required: [snapshot_id, files, verify_integrity]
      properties:
        snapshot_id:
          type: string
          example: vss_20260131_100000
        files:
          type: array
          items:
            type: string
        verify_integrity:
          type: boolean
    RecoverResponse:
      type: object
      required: [status, files_recovered, integrity_verified, timestamp]
      properties:
        status:
          type: string
          example: success
        files_recovered:
          type: integer
        integrity_verified:
          type: boolean
        timestamp:
          type: string
          format: date-time
    TriggerRequest:
      type: object
      required: [incident_id, process_id, threat_level, action_required]
      properties:
        incident_id:
          type: string
          example: inc_998877
        process_id:
          type: integer
          example: 4512
        threat_level:
          type: string
          example: critical
        action_required:
          type: string
          example: terminate_process
    TriggerResponse:
      type: object
      required: [status, actions_taken, timestamp]
      properties:
        status:
          type: string
          example: success
        actions_taken:
          type: array
          items:
            type: string
          example: [process_terminated, network_isolated, admin_notified]
        timestamp:
          type: string
          format: date-time
    AnalyzeRequest:
      type: object
      required: [file_path]
      properties:
        file_path:
          type: string
          example: /path/to/file.doc
