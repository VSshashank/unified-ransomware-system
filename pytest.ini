[pytest]
# The protected path is not source, and during Phase 5 it is full of other
# people's code on purpose: the benign corpus clones this repository into it to
# measure what an ordinary `git clone` looks like to the agent, and the attack
# corpus fills it with encrypted documents. A bare `pytest` at the root
# collected all of it - 58 collection errors from a clone of the suite already
# running - so the one gate the build plan asks to be runnable stopped being
# runnable while the run it measures was in progress.
#
# `data/` is excluded for a different reason: the ledger lives there behind an
# ACL that denies the ordinary user, which is the point of it, and collection
# walking into it raises WinError 5 before any test has run.
#
# Only the defaults plus those two. Nothing here changes which of this
# project's own tests are collected.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} watched_files data
