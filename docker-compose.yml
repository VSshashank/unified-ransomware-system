version: "3.8"

# Port publication: the four backend services bind to 127.0.0.1 only. They carry
# no authentication of their own - POST :8003/ledger/log with no token appends to
# the audit trail, and :8004/response/isolate is reachable the same way - so
# publishing them on 0.0.0.0 exposed every one of those routes to the LAN.
# Loopback keeps the host-side tooling working (scripts/si_demo.py and
# scripts/verify_vss.py talk to :8003 and :8004 directly) while removing remote
# reach. Gateway :8000 and dashboard :8501 stay published: they are the intended
# front doors, and the gateway is the only service that authenticates.
services:
  monitor:
    build: ./services/monitor
    container_name: ransomware_monitor
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./watched_files:/watch
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WATCH_PATH=${WATCH_PATH:-/watch}
      # The monitor drives the detection pipeline, so it needs the same service
      # URLs the gateway has. Without these it falls back to its own defaults
      # and only works while those happen to match the container names - which
      # silently stops being true the moment a service moves.
      - ML_URL=${ML_URL:-http://ml_engine:8002}
      - LEDGER_URL=${LEDGER_URL:-http://ledger:8003}
      - RESPONSE_URL=${RESPONSE_URL:-http://response:8004}
      - ENTROPY_THRESHOLD=${ENTROPY_THRESHOLD:-7.5}
    restart: unless-stopped
    networks:
      - ransomware_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ml_engine:
    build: ./services/ml-engine
    container_name: ransomware_ml
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./models:/models
      - ./logs:/app/logs
    environment:
      - MODEL_PATH=${MODEL_PATH:-/models/xgboost_model.pkl}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    networks:
      - ransomware_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  ledger:
    build: ./services/ledger
    container_name: ransomware_ledger
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      # The hash chain must outlive the container - a wiped ledger is a wiped
      # audit trail.
      - ./data/ledger:/app/data
      - ./logs:/app/logs
    environment:
      - LEDGER_DB_PATH=${LEDGER_DB_PATH:-/app/data/ledger.db}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    networks:
      - ransomware_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  response:
    build: ./services/response
    container_name: ransomware_response
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      # Recovery restores files back to the paths the monitor watches.
      - ./watched_files:/watch
      - ./data/snapshots:/app/snapshots
      - ./logs:/app/logs
    environment:
      - LEDGER_URL=${LEDGER_URL:-http://ledger:8003}
      # VSS does not exist in a Linux container; this directory stands in as the
      # snapshot source so recovery is exercisable in compose. See README-SI.md.
      - RECOVERY_SNAPSHOT_ROOT=${RECOVERY_SNAPSHOT_ROOT:-/app/snapshots}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ledger:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ransomware_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    build: ./services/gateway
    container_name: ransomware_gateway
    ports:
      - "8000:8000"
    environment:
      - MONITOR_URL=${MONITOR_URL:-http://monitor:8001}
      - ML_URL=${ML_URL:-http://ml_engine:8002}
      - LEDGER_URL=${LEDGER_URL:-http://ledger:8003}
      - RESPONSE_URL=${RESPONSE_URL:-http://response:8004}
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      # Development, so the committed JWT_SECRET above is a loud warning rather
      # than a refusal to start. Set URDS_ENV=production and the gateway will
      # not boot until JWT_SECRET is a real secret.
      - URDS_ENV=${URDS_ENV:-development}
      # POST /auth/token verifies no identity. It stays on for local work, but
      # the flag is explicit here so it can be turned off without a code change.
      - ALLOW_DEV_TOKENS=${ALLOW_DEV_TOKENS:-true}
      # Required to mint anything above a "free" token. Change it alongside
      # JWT_SECRET for any deployment that is not a laptop.
      - DEV_TOKEN_BOOTSTRAP_SECRET=${DEV_TOKEN_BOOTSTRAP_SECRET:-dev-bootstrap-change-me}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      monitor:
        condition: service_healthy
      ml_engine:
        condition: service_healthy
      ledger:
        condition: service_healthy
      response:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ransomware_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  dashboard:
    build: ./services/dashboard
    container_name: ransomware_dashboard
    ports:
      - "8501:8501"
    environment:
      - GATEWAY_URL=${GATEWAY_URL:-http://gateway:8000}
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ransomware_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

networks:
  ransomware_net:
    driver: bridge
